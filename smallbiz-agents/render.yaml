services:
  - type: web
    name: smallbiz-ai-agents
    runtime: python
    # The free plan has no persistent disk: the database below lives in
    # /tmp and is wiped on every deploy/restart. Fine for a trial; for a
    # real customer, switch to a paid instance and uncomment the disk.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /tmp/app.db           # /var/data/app.db once the disk is attached
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: INBOUND_EMAIL_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
