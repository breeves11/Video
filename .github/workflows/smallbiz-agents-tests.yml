name: Small Business AI Agents Tests

on:
  push:
    branches: ["**"]
    paths:
      - "smallbiz-agents/**"
      - ".github/workflows/smallbiz-agents-tests.yml"
  pull_request:
    paths:
      - "smallbiz-agents/**"
      - ".github/workflows/smallbiz-agents-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smallbiz-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
