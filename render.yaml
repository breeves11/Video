services:
  - type: web
    name: youtube-niche-content-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /tmp/app.db
      - key: REVENUE_GOAL_USD
        value: "5000"
      - key: POLL_INTERVAL_HOURS
        value: "6"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
